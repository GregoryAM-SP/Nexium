name: Sync issue template versions

# Keeps the bug report's version dropdown current without manual edits. Runs when
# a release is published, on demand, and every day at midnight (UTC) so deleted or
# edited releases are reflected too.
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: sync-issue-template-versions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event checks out the tag, which leaves HEAD detached and
          # makes the push below fail with "You are not currently on a branch".
          # Always run against the default branch so there is a branch to push to.
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh the version dropdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/sync-issue-versions.mjs

      - name: Commit when the versions changed
        run: |
          if git diff --quiet -- .github/ISSUE_TEMPLATE/bug_report.yml; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/bug_report.yml
          git commit -m "chore(issues): sync version dropdown with published releases"
          git push origin HEAD:${{ github.event.repository.default_branch }}
