name: Bug report
description: Something in Nexium is broken, crashes, or behaves differently than expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Clear, complete reports get fixed fastest.
        Please search the [existing issues](https://github.com/GregoryAM-SP/Nexium/issues?q=is%3Aissue) first.

  - type: dropdown
    id: version
    attributes:
      label: Nexium version
      description: Shown in the title bar menu (Help → About) or in the installer file name.
      options:
        # <nexium-versions:start>
        - v1.0.10
        - v1.0.9
        - v1.0.8
        - v1.0.7
        - v1.0.6
        - v1.0.5
        - v1.0.4
        - v1.0.3
        - v1.0.2
        - v1.0.1
        - v1.0.0
        # <nexium-versions:end>
        - Not listed — I wrote the exact version below
    validations:
      required: true

  - type: input
    id: version-other
    attributes:
      label: Exact version (only if not listed above)
      placeholder: e.g. 1.0.3 (build 2026-11-16)
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux — Ubuntu / Debian
        - Linux — Fedora / RHEL
        - Linux — Arch
        - Linux — other distribution
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Nexium?
      options:
        - Windows installer (.exe)
        - Windows installer (.msi)
        - AppImage
        - RPM package (.rpm)
        - DEB package (.deb)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of Nexium is affected?
      description: Pick the closest area; choose "Other" if you are unsure.
      options:
        - AI Agent / Assistant
        - Editor
        - Explorer / file operations
        - Search
        - Source Control / Git
        - Terminal
        - Preview
        - Tasks
        - Updates / installer
        - Settings
        - Other
    validations:
      required: true

  - type: input
    id: ai-provider
    attributes:
      label: AI provider and model (AI Agent issues only)
      description: Settings → AI Agent → Providers. Never paste your API key.
      placeholder: e.g. NVIDIA NIM / glm-5.3-flash
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did and what Nexium did instead. Keep it factual.
      placeholder: I opened a project, asked the AI Agent to read a file, and the run stayed on "Thinking" until it timed out.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number the steps so the issue can be followed exactly.
      placeholder: |
        1. Open a folder with a package.json
        2. Open the AI Agent and send "list the scripts"
        3. The run stalls on "Reviewing tool results"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: The agent reads the file and answers with the script list.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      description: Copy the exact message or the terminal output. Remove API keys, tokens and private file contents first.
      render: shell
    validations:
      required: false

  - type: input
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag images into this report after submitting, or paste links here.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am running the latest Nexium release, or the version is listed above.
          required: true
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I removed API keys, tokens and private file contents from this report.
          required: true
